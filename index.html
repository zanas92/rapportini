<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rapportini</title>
  <meta name="theme-color" content="#1f5fbf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rapportini">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // Se c'è un PIN, nasconde subito i dati prima che la pagina venga disegnata.
    try { if (localStorage.getItem('rapportini.pin')) document.documentElement.classList.add('locked'); } catch (e) {}
  </script>
</head>
<body>
  <div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lock-msg">
    <img class="lock-logo" src="icons/icon-192.png" alt="">
    <p class="lock-msg" id="lock-msg">Inserisci il PIN</p>
    <div class="pin-dots" id="pin-dots"><span></span><span></span><span></span><span></span></div>
    <div class="keypad" id="keypad">
      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <span></span>
      <button type="button" data-digit="0">0</button>
      <button type="button" class="key-del" id="pin-del" aria-label="Cancella">&#9003;</button>
    </div>
    <button type="button" class="link-btn" id="lock-cancel">Annulla</button>
    <button type="button" class="link-btn" id="lock-forgot">PIN dimenticato?</button>
  </div>

  <header class="topbar">
    <button class="icon-btn" id="prev" aria-label="Mese precedente">&#8249;</button>
    <button class="month-title" id="month-title" aria-label="Torna al mese corrente"></button>
    <button class="icon-btn" id="next" aria-label="Mese successivo">&#8250;</button>
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Esporta e backup">&#8943;</button>
  </header>

  <section class="summary" aria-live="polite">
    <div class="wide"><span class="label">Totale lavorate · <span id="days-worked">0 giorni</span></span><strong id="total">0 h</strong></div>
    <div><span class="label">Ordinarie</span><strong id="sum-ord">0 h</strong></div>
    <div><span class="label">Straordinario</span><strong id="sum-str">0 h</strong></div>
    <div><span class="label">Festive</span><strong id="sum-fest">0 h</strong></div>
    <div><span class="label">Ferie</span><strong id="sum-ferie">0 g</strong></div>
    <div><span class="label">Permessi</span><strong id="sum-perm">0 h</strong></div>
    <div id="tile-mal" hidden><span class="label">Malattia</span><strong id="sum-mal">0 g</strong></div>
  </section>

  <main>
    <ul class="days" id="days"></ul>
  </main>

  <dialog id="menu">
    <form method="dialog" class="sheet">
      <h2>Esporta e backup</h2>
      <button type="button" class="sheet-btn" id="export-month">Esporta mese (CSV / Excel)</button>
      <button type="button" class="sheet-btn" id="export-all">Esporta tutto (CSV / Excel)</button>
      <button type="button" class="sheet-btn" id="backup">Salva backup completo (JSON)</button>
      <button type="button" class="sheet-btn" id="restore">Ripristina da backup&hellip;</button>
      <p class="hint" id="last-backup"></p>
      <h2 class="sheet-sub">Orario e straordinari</h2>
      <label class="field-label" for="set-daily">Ore ordinarie al giorno (oltre = straordinario)</label>
      <select id="set-daily" class="field"></select>
      <label class="check"><input type="checkbox" id="set-saturday"> Il sabato è giorno lavorativo</label>
      <label class="field-label" for="set-patron">Santo patrono (gg/mm, facoltativo)</label>
      <input id="set-patron" class="field" inputmode="numeric" placeholder="es. 24/06" maxlength="5">
      <h2 class="sheet-sub">Sicurezza</h2>
      <button type="button" class="sheet-btn" id="pin-set">Imposta PIN</button>
      <button type="button" class="sheet-btn danger" id="pin-remove">Rimuovi PIN</button>
      <button class="sheet-btn close">Chiudi</button>
    </form>
  </dialog>

  <dialog id="note-dialog">
    <form method="dialog" class="sheet">
      <h2 id="note-title"></h2>
      <label class="field-label" for="note-text">Descrizione</label>
      <textarea id="note-text" rows="3" maxlength="500"
                placeholder="Descrizione del lavoro svolto…"></textarea>
      <label class="field-label" for="abs-type">Ferie / permessi</label>
      <select id="abs-type" class="field">
        <option value="">Nessuna assenza</option>
        <option value="ferie">Ferie (giornata intera)</option>
        <option value="permesso">Permesso (a ore)</option>
        <option value="malattia">Malattia (giornata intera)</option>
      </select>
      <div id="abs-hours-row" hidden>
        <label class="field-label" for="abs-hours">Ore di permesso</label>
        <select id="abs-hours" class="field">
          <option value="0.5">30 min</option><option value="1">1 h</option>
          <option value="1.5">1 h 30</option><option value="2">2 h</option>
          <option value="2.5">2 h 30</option><option value="3">3 h</option>
          <option value="3.5">3 h 30</option><option value="4">4 h</option>
          <option value="4.5">4 h 30</option><option value="5">5 h</option>
          <option value="5.5">5 h 30</option><option value="6">6 h</option>
          <option value="6.5">6 h 30</option><option value="7">7 h</option>
          <option value="7.5">7 h 30</option><option value="8">8 h</option>
        </select>
      </div>
      <button type="button" class="sheet-btn" id="note-save">Salva</button>
      <button class="sheet-btn close">Annulla</button>
    </form>
  </dialog>

  <input type="file" id="restore-file" accept=".json,application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
